<ion-content class="surface-light" [fullscreen]="true">
  <header class="screen-head">
    <div class="title-row">
      <h1 class="screen-title">Dinero</h1>
      <app-help-button topic="cuentas"></app-help-button>
    </div>
    <app-month-switcher></app-month-switcher>
  </header>

  @if (netWorth(); as n) {
    <section class="hero" aria-labelledby="patrimonio-label">
      <p id="patrimonio-label" class="hero-label">Patrimonio</p>
      <p class="hero-amount">{{ money(n.total) }}</p>
      <p class="hero-note">Disponible {{ money(n.available) }}@if (n.owedToMe > 0) { · Te deben {{ money(n.owedToMe) }}} · Debes {{ money(n.owe) }}</p>
    </section>
  }

  <app-cuentas-view [focus]="ver()"></app-cuentas-view>
</ion-content>
