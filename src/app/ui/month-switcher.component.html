<div class="switcher" role="group" [attr.aria-label]="t('fields.month')">
  <button type="button" class="arrow" [attr.aria-label]="t('fields.prevMonth')" (click)="state.previous()">
    <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
  </button>

  <div class="anchor">
    <button
      type="button"
      class="label"
      aria-haspopup="menu"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="t('fields.chooseOtherMonth', { month: state.label() })"
      (click)="toggle()"
    >
      <span aria-live="polite">{{ state.label() }}</span>
      <ion-icon name="chevron-down" aria-hidden="true" [class.flipped]="open()"></ion-icon>
    </button>

    <app-dropdown class="month-menu" origin="top-center" [label]="t('fields.chooseMonth')" [(open)]="open">
      <div class="year">
        <button type="button" class="year-arrow" [attr.aria-label]="t('fields.prevYear')" (click)="year.set(year() - 1)">
          <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
        </button>
        <span class="year-label">{{ year() }}</span>
        <button type="button" class="year-arrow" [attr.aria-label]="t('fields.nextYear')" (click)="year.set(year() + 1)">
          <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
        </button>
      </div>
      <div class="months">
        @for (m of months(); track m.number) {
          <button
            type="button"
            role="menuitemradio"
            class="month"
            [class.today]="key(m.number) === today"
            [attr.aria-checked]="key(m.number) === selected()"
            (click)="pick(key(m.number))"
          >
            {{ m.name }}
          </button>
        }
      </div>
      <button type="button" role="menuitem" class="t-menu-item go-today" (click)="pick(today)">{{ t('fields.goToday') }}</button>
    </app-dropdown>
  </div>

  <button type="button" class="arrow" [attr.aria-label]="t('fields.nextMonth')" (click)="state.next()">
    <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
  </button>
</div>
