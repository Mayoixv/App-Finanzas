<ion-content class="surface-light">
  <div class="sheet" [class.is-saved]="saved()">
    <header class="sheet-head">
      <h1 class="screen-title">{{ isEdit() ? 'Editar deuda' : 'Nueva deuda' }}</h1>
      <button type="button" class="close" aria-label="Cancelar" (click)="cancel()">
        <ion-icon name="close" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <div class="kind" role="radiogroup" aria-label="Tipo de deuda">
      <button type="button" role="radio" [attr.aria-checked]="direction() === 'debo'" (click)="direction.set('debo')">Debo</button>
      <button type="button" role="radio" [attr.aria-checked]="direction() === 'me_deben'" (click)="direction.set('me_deben')">Me deben</button>
    </div>

    <div class="field">
      <ion-input
        label="Nombre"
        label-placement="floating"
        [placeholder]="direction() === 'debo' ? 'Préstamo del carro, tarjeta' : 'Nombre de quien te debe'"
        [value]="name()"
        (ionInput)="name.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        label="Monto prestado ({{ currency() }})"
        label-placement="floating"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0.00"
        [value]="principal()"
        (ionInput)="principal.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        label="Tasa de interés anual % (opcional)"
        label-placement="floating"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0"
        [value]="rate()"
        (ionInput)="rate.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        label="Plazo en meses (opcional)"
        label-placement="floating"
        type="number"
        inputmode="numeric"
        min="1"
        placeholder="Ej. 24"
        [value]="term()"
        (ionInput)="term.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <app-date-field label="Fecha del préstamo" [(value)]="startDate"></app-date-field>
    </div>

    @if (preview(); as text) {
      <p class="hint">{{ text }}</p>
    }

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="button" class="btn-primary save" [disabled]="!canSave()" (click)="save()">
      {{ isEdit() ? 'Guardar cambios' : 'Guardar deuda' }}
    </button>

    @if (isEdit()) {
      <button type="button" class="delete" [disabled]="saving()" (click)="confirmDelete()">Eliminar deuda</button>
    }
  </div>

  <div class="done" [class.visible]="saved()" aria-live="polite">
    @if (saved()) {
      <app-success-check state="in"></app-success-check>
      <p class="done-text">{{ isEdit() ? 'Cambios guardados' : 'Deuda guardada' }}</p>
    }
  </div>
</ion-content>
