<ion-content class="surface-light">
  <div class="sheet" [class.is-saved]="saved()">
    <header class="sheet-head">
      <h1 class="screen-title">{{ isEdit() ? t('deuda.edit') : t('deuda.new') }}</h1>
      <button type="button" class="close" [attr.aria-label]="t('common.cancel')" (click)="cancel()">
        <ion-icon name="close" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <div class="kind" role="radiogroup" [attr.aria-label]="t('deuda.kind')">
      <button type="button" role="radio" [attr.aria-checked]="direction() === 'debo'" (click)="direction.set('debo')">{{ t('deudas.iOwe') }}</button>
      <button type="button" role="radio" [attr.aria-checked]="direction() === 'me_deben'" (click)="direction.set('me_deben')">{{ t('deudas.theyOwe') }}</button>
    </div>

    <div class="field">
      <ion-input
        [label]="t('common.name')"
        label-placement="floating"
        [placeholder]="direction() === 'debo' ? t('deuda.mePlaceholder') : t('deuda.themPlaceholder')"
        [value]="name()"
        (ionInput)="name.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        [label]="t('deuda.principal', { currency: currency() })"
        label-placement="floating"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0.00"
        [value]="principal()"
        (ionInput)="principal.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        [label]="t('deuda.rate')"
        label-placement="floating"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0"
        [value]="rate()"
        (ionInput)="rate.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        [label]="t('deuda.term')"
        label-placement="floating"
        type="number"
        inputmode="numeric"
        min="1"
        [placeholder]="t('common.example', { value: 24 })"
        [value]="term()"
        (ionInput)="term.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <app-date-field [label]="t('deuda.date')" [(value)]="startDate"></app-date-field>
    </div>

    @if (preview(); as text) {
      <p class="hint">{{ text }}</p>
    }

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="button" class="btn-primary save" [disabled]="!canSave()" (click)="save()">
      {{ isEdit() ? t('common.saveChanges') : t('deuda.save') }}
    </button>

    @if (isEdit() && !draft) {
      <button type="button" class="delete" [disabled]="saving()" (click)="confirmDelete()">{{ t('deuda.delete') }}</button>
    }
  </div>

  <div class="done" [class.visible]="saved()" aria-live="polite">
    @if (saved()) {
      <app-success-check state="in"></app-success-check>
      <p class="done-text">{{ isEdit() ? t('common.changesSaved') : t('deuda.saved') }}</p>
    }
  </div>
</ion-content>
