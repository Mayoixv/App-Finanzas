<ion-content class="surface-light">
  <div class="sheet" [class.is-saved]="saved()">
    <header class="sheet-head">
      <h1 class="screen-title">{{ isCollect ? 'Cobro de ' : 'Pago a ' }}{{ view.debt.name }}</h1>
      <button type="button" class="close" aria-label="Cancelar" (click)="cancel()">
        <ion-icon name="close" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <div class="field">
      <ion-input
        label="Monto ({{ currency() }})"
        label-placement="stacked"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0.00"
        [value]="amount()"
        (ionInput)="amount.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    <div class="field">
      <ion-input
        label="Fecha"
        label-placement="stacked"
        type="date"
        [value]="date()"
        (ionInput)="date.set(($event.detail.value ?? '').toString())"
      ></ion-input>
    </div>

    @if (preview(); as text) {
      <p class="hint">{{ text }}</p>
    }

    <label class="check">
      <input type="checkbox" [checked]="asMovement()" (change)="asMovement.set($any($event.target).checked)" />
      {{ isCollect ? 'Anotarlo también como ingreso en Movimientos' : 'Anotarlo también como gasto en Movimientos' }}
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="button" class="btn-primary save" [disabled]="!canSave()" (click)="save()">
      {{ isCollect ? 'Guardar cobro' : 'Guardar pago' }}
    </button>
  </div>

  <div class="done" [class.visible]="saved()" aria-live="polite">
    @if (saved()) {
      <app-success-check state="in"></app-success-check>
      <p class="done-text">{{ isCollect ? 'Cobro guardado' : 'Pago guardado' }}</p>
    }
  </div>
</ion-content>
