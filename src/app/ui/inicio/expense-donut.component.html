<div class="donut">
  <svg viewBox="0 0 200 200" role="img" [attr.aria-label]="t('donut.label', { summary: summary() })">
    <circle class="track" cx="100" cy="100" r="80" />
    @for (arc of arcs(); track arc.name) {
      <circle
        class="arc"
        cx="100"
        cy="100"
        r="80"
        [attr.stroke]="arc.color"
        [style.stroke-dasharray]="arc.dashArray"
        [style.stroke-dashoffset]="arc.dashOffset"
        transform="rotate(-90 100 100)"
      />
    }
  </svg>
  <div class="center">
    <span class="center-amount">{{ money(total()) }}</span>
    <span class="center-label">{{ t('donut.spent') }}</span>
  </div>
</div>

<ul class="legend">
  @for (arc of arcs(); track arc.name) {
    <li>
      <span class="swatch" [style.background]="arc.color" aria-hidden="true"></span>
      <span class="name">{{ arc.name }}</span>
      <span class="value">{{ money(arc.amount) }}</span>
      <span class="share">{{ t('donut.share', { percent: percent(arc.percent) }) }}</span>
    </li>
  }
</ul>
