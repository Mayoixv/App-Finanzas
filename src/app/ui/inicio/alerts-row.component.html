@if (visible()) {
  <section class="alerts" aria-label="Alertas">
    @for (a of alerts(); track a.key) {
      <button type="button" [class]="'alert ' + a.tone" (click)="open(a)">
        <ion-icon class="icon" [name]="a.icon" aria-hidden="true"></ion-icon>
        <span class="text">{{ a.text }}</span>
        <ion-icon class="go" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
    }
  </section>
}
