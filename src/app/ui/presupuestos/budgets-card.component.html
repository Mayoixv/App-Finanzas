<section class="card" aria-labelledby="presupuestos-title">
  <h2 id="presupuestos-title" class="section-title">{{ t('budgets.title', { month: monthState.label() }) }}</h2>
  <p class="sr-only" aria-live="polite">{{ liveMessage() }}</p>

  @if (failed()) {
    <p class="card-empty">{{ t('budgets.failed') }}</p>
  } @else if (rows(); as list) {
    @if (list.length > 0) {
      <ul [class.t-still]="!monthState.animateLists()" class="budgets">
        @for (b of list; track b.budget.id) {
          <li animate.enter="t-row-enter" animate.leave="t-row-leave">
            <button
              type="button"
              class="budget"
              [attr.aria-label]="t('budgets.editLabel', { name: b.name, text: b.text })"
              (click)="edit(b)"
            >
              <span class="budget-head">
                <span class="budget-name">{{ b.name }}</span>
                <span class="budget-amounts">{{ t('budgets.spentOf', { spent: money(b.spent), limit: money(b.limit) }) }}</span>
              </span>
              <span class="bar" aria-hidden="true">
                <span [class]="'bar-fill ' + b.state" [style.width.%]="b.bar"></span>
              </span>
              <span [class]="'budget-text ' + b.state">
                @if (b.state === 'exceeded') {
                  <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
                }
                {{ b.text }}
              </span>
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="card-empty">{{ t('budgets.empty') }}</p>
      @if (previousCount() > 0) {
        <button type="button" class="btn-secondary action" (click)="copyPrevious()">
          {{ t('budgets.copy', { month: previousLabel() }) }}
        </button>
      }
    }
    <button type="button" class="btn-secondary action" (click)="add()">{{ t('budgets.add') }}</button>
  }
</section>
