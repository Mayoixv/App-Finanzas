<ion-router-outlet [animated]="false"></ion-router-outlet>

<nav class="t-tabs" role="tablist" [attr.aria-label]="t('common.sections')">
  <span #pill class="t-tabs-pill" aria-hidden="true"></span>
  @for (tab of tabs; track tab.path; let i = $index) {
    <button
      #tab
      type="button"
      class="t-tab"
      role="tab"
      [attr.aria-selected]="active() === i"
      [attr.aria-label]="t('tabs.' + tab.path + '.name')"
      (click)="go(tab)"
    >
      <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
      <span class="t-tab-label">{{ t('tabs.' + tab.path + '.label') }}</span>
    </button>
  }
</nav>

<button type="button" class="btn-primary add-button" [attr.aria-label]="addLabel()" (click)="add()">
  <ion-icon name="add" aria-hidden="true"></ion-icon>
</button>
